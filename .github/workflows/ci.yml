# Tests, typecheck and both builds (client and server) on every pull request.
#
# deploy.yml runs the same checks, but only on push to main — which gates the
# deploy, not the PR. The server's access rules are ordinary TypeScript now and
# `npm test` exercises them against a real SQLite, so there is no separate SQL
# job any more.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
